<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OPERATION BLACKSITE — Tactical 3D FPS</title>
  <style>
    :root {
      --bg-dark: #0a0e14;
      --bg-panel: rgba(13, 19, 28, 0.92);
      --bg-card: rgba(21, 30, 44, 0.88);
      --border-tactical: rgba(86, 168, 245, 0.32);
      --accent-amber: #f59e0b;
      --accent-cyan: #38bdf8;
      --accent-red: #ef4444;
      --accent-green: #22c55e;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --font-ui: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-mono: 'Consolas', 'Courier New', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-ui);
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    .interactive-panel {
      pointer-events: auto;
    }

    /* Tactical Buttons & Controls */
    .btn-tactical {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
      border: 1px solid var(--border-tactical);
      border-left: 3px solid var(--accent-amber);
      color: var(--text-main);
      padding: 10px 18px;
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-tactical:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.22), rgba(30, 41, 59, 0.98));
      border-color: var(--accent-amber);
      transform: translateX(2px);
    }

    .btn-tactical:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(135deg, #d97706, #b45309);
      border-color: #fbbf24;
      border-left: 4px solid #fde68a;
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.4);
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.4);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <div id="ui-layer"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
